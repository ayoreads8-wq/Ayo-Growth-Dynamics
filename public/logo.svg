<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="400" height="340">
  <rect width="100%" height="100%" fill="#101828"/>
  <defs>
    <!-- Leftmost Bar -->
    <linearGradient id="bar1Grad" x1="125" y1="210" x2="165" y2="125" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16A36A" />
      <stop offset="60%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>

    <!-- Middle Bar -->
    <linearGradient id="bar2Grad" x1="155" y1="210" x2="190" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="60%" stop-color="#16A36A" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <!-- Inner Right Bar -->
    <linearGradient id="bar3Grad" x1="180" y1="210" x2="210" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F5132" />
      <stop offset="60%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#16A36A" />
    </linearGradient>

    <!-- Sweeping Arrow Arch -->
    <linearGradient id="arrowArchGrad" x1="275" y1="210" x2="170" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14532D" />
      <stop offset="35%" stop-color="#15803D" />
      <stop offset="70%" stop-color="#16A36A" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <!-- Arrowhead -->
    <linearGradient id="arrowHeadGrad" x1="160" y1="120" x2="185" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16A36A" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
  </defs>

  <!-- Bar 1: Leftmost Slanted Pillar -->
  <polygon points="128,210 150,210 172,156 158,126" fill="url(#bar1Grad)"/>

  <!-- Bar 2: Middle Slanted Pillar -->
  <polygon points="157,210 177,210 195,168 180,138" fill="url(#bar2Grad)"/>

  <!-- Bar 3: Rightmost Slanted Pillar -->
  <polygon points="184,210 208,210 217,190 200,156" fill="url(#bar3Grad)"/>

  <!-- Sweeping Arrow Arch -->
  <path d="M 274 210 C 248 210, 222 190, 202 158 C 192 142, 184 125, 180 114 L 196 108 C 204 125, 220 152, 242 178 C 258 196, 268 205, 274 210 Z" fill="url(#arrowArchGrad)"/>

  <!-- Arrowhead at Apex -->
  <polygon points="172,72 156,110 177,104 198,96" fill="url(#arrowHeadGrad)" stroke="url(#arrowHeadGrad)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="200" y="265" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" letter-spacing="2" fill="#22C55E" text-anchor="middle">AYO GROWTH</text>
  <text x="202" y="295" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="8" fill="#86EFAC" text-anchor="middle">DYNAMICS</text>
</svg>
